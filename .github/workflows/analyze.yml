name: バズ分析(週1)

on:
  schedule:
    # 毎週月曜 日本時間 9:00(UTC 0:00)
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存関係インストール
        run: pip install -r requirements.txt

      - name: インサイト取得・分析
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: python main.py analyze

      - name: 分析結果をコミット
        run: |
          git config user.name "autopost-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f data/post_history.json || true
          git diff --cached --quiet || git commit -m "インサイトを更新"
          git push
